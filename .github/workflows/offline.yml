name: Offline source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r team-delivery-kit/requirements-test.txt
      - run: python scripts/check_publication.py --self-test
      - run: python scripts/check_publication.py
      - name: Deterministic tests (no LLM, credentials or Docker socket)
        working-directory: team-delivery-kit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
        run: python -m unittest discover -s tests -q
